spring.application.name=salon-onboarding

spring.datasource.url=jdbc:h2:file:./data/onboarding
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.web.resources.cache.cachecontrol.no-cache=true

app.seed-demo-data=true

# How long a salon can sit in a stage before it's flagged as stalled. Defaults are in StallPolicy;
# these three can also be set from the environment (e.g. 1d or 2m for a live demo).
stall.thresholds[SIGNUP_ABANDONED]=${STALL_SIGNUP_ABANDONED:1d}
stall.thresholds[VERIFICATION_NOT_STARTED]=${STALL_VERIFICATION_NOT_STARTED:5d}
stall.thresholds[VERIFICATION_STARTED]=${STALL_VERIFICATION_STARTED:3d}
