spring.application.name=salon-onboarding

spring.datasource.url=jdbc:h2:file:./data/onboarding
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.web.resources.cache.cachecontrol.no-cache=true

app.seed-demo-data=true

# How long a salon can sit in a stage before it's flagged as stalled. Defaults are in StallPolicy;
# these three can also be set from the environment (e.g. 1d or 2m for a live demo).
stall.thresholds[SIGNUP_ABANDONED]=${STALL_SIGNUP_ABANDONED:1d}
stall.thresholds[VERIFICATION_NOT_STARTED]=${STALL_VERIFICATION_NOT_STARTED:5d}
stall.thresholds[VERIFICATION_STARTED]=${STALL_VERIFICATION_STARTED:3d}

# Meta. OFFLINE uses the built-in simulator; LIVE needs the app ID, secret and configuration ID (see .env.example).
meta.mode=${META_MODE:OFFLINE}
meta.app-id=${META_APP_ID:}
meta.app-secret=${META_APP_SECRET:}
meta.config-id=${META_CONFIG_ID:}
meta.graph-version=${META_GRAPH_VERSION:v26.0}
# Two-step verification PIN set on each salon's number when it's registered.
meta.registration-pin=${META_REGISTRATION_PIN:246810}
